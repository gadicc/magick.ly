name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ROOT_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: ci-build-only-not-a-production-secret
      BETTER_AUTH_SECRET: ci-build-only-better-auth-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-build-only-google-client
      GOOGLE_CLIENT_SECRET: ci-build-only-google-secret
      # Build verification must never connect to production services.
      MONGO_URL: mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=100
      DATABASE_URL: postgresql://build:build@127.0.0.1:1/build?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://build:build@127.0.0.1:1/build?sslmode=disable
      OPENAI_API_KEY: ci-build-only-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec loom init
      - run: pnpm exec loom check
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
